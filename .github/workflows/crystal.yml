name: Crystal CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: DuckDB ${{ matrix.duckdb }} / Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # spec/spec_helper.cr uses File.delete?, introduced in Crystal 1.5.0.
        crystal: [latest, '1.5.0']
        # Archive names and SHA-256 digests are pinned in scripts/ci-local.sh.
        duckdb: ['1.5.6', '2.0.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1.9.5
        with:
          crystal: ${{ matrix.crystal }}
      - name: Download and verify DuckDB, install shards, and run specs
        run: scripts/ci-local.sh "${{ matrix.duckdb }}" "$RUNNER_TEMP/duckdb"
      - name: Check README programs
        run: |
          export LIBRARY_PATH="$RUNNER_TEMP/duckdb/duckdb-${{ matrix.duckdb }}"
          export LD_LIBRARY_PATH="$LIBRARY_PATH"
          scripts/check-readme.sh
      - name: Run execution-context specs with four workers
        if: matrix.crystal == 'latest'
        timeout-minutes: 3
        env:
          CRYSTAL_WORKERS: 4
          LIBRARY_PATH: ${{ runner.temp }}/duckdb/duckdb-${{ matrix.duckdb }}
          LD_LIBRARY_PATH: ${{ runner.temp }}/duckdb/duckdb-${{ matrix.duckdb }}
        run: crystal spec spec/duckdb/execution_context_spec.cr
